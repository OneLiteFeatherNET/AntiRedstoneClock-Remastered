# Languages loaded on startup. 'en-US' is always loaded as the fallback.
# Shipped out of the box:
#   af-ZA  ar-SA  ca-ES  cs-CZ  da-DK  de-DE  el-GR  en-US  es-ES  fi-FI
#   fr-FR  he-IL  hu-HU  it-IT  ja-JP  ko-KR  nl-NL  no-NO  pl-PL  pt-BR
#   pt-PT  ro-RO  ru-RU  sr-Cyrl  sv-SE  tr-TR  uk-UA  vi-VN  zh-CN  zh-TW
# Drop your own antiredstoneclockremasterd_<tag>.properties into the lang folder
# to override any of them.
translations:
  - 'en-US'

check:
  mode: 'dynamic' # 'dynamic' or 'static'
  redstoneAndRepeater: true
  observer: true
  piston: true
  comparator: true
  sculk: true
  # A hopper clock is a pair of hoppers pointing at each other, moving an item back and forth
  hopper: true
  ignoredWorlds:
    - world
  ignoredRegions: []

clock:
  endDelay: 300
  maxCount: 150
  autoBreak: true
  notifyAdmins: false
  notifyConsole: true
  drop: true

# Debug messages are written to debug-logs/latest.log inside this directory,
# they never show up in the server log.
debug:
  enabled: false
  # How many rotated log files are kept next to latest.log
  keepFiles: 5

tps:
  interval: 2
  max: 20
  min: 15

notification:
  # Should be lowercase
  enabled:
    - console
    - admins
    - discord
    - sign
  discord:
    webhook: "_here_comes_the_webhook_url_"
    avatar: "https://cdn.modrinth.com/data/UWh9tyEa/ea7b1aded47652100a1f0e8673e87c124b38fc08_96.webp"
    # Should be a hex color code without the #
    color: 0xFF00FF
    description: |
      <red><bold>There is a redstone clock in <world> at <x>,<y>,<z></bold>
    fields:
      - name: "Teleport Command"
        value: "/teleport <x> <y> <z>"
        inline: true
      

  sign:
    material: OAK_SIGN
    # Should be a list of strings for each line of the sign
    # The max length of each line is 16 characters
    front:
      - "<red>RedstoneClocks!"
      - "<red>Are"
      - "<red>prohibited"
    back:
      - "<red>RedstoneClocks!"
      - "<red>Are"
      - "<red>prohibited"
